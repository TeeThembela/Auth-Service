spring:
  application:
    name: TeeGate
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5433/auth-service
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

application:
  mail-sender: ${MAIL_SENDER}
  mail:
    retry:
      max-retries: 3
      delay: 2000
      multiplier: 2.0
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      access-token-expiration: ${JWT_ACCESS_EXPIRATION}
      refresh-token-expiration: ${JWT_REFRESH_EXPIRATION}
      password-reset-token-expiration: ${JWT_PASSWORD_RESET_EXPIRATION}
      issuer: ${JWT_ISSUER}
  scheduler:
    refresh-token-cleanup-cron: ${RT_CLEANUP_CRON:0 0 2 * * *}